[project]
name = "curious-astronaut"
version = "8.12.0"
description = "Curious Astronaut — an interactive citation/similarity graph explorer with an AI teacher that narrates a field's history over the graph."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Charles Patrick James", email = "charles.patrick.james@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "research",
    "citations",
    "knowledge-graph",
    "semantic-scholar",
    "arxiv",
    "literature-review",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Education",
    "Typing :: Typed",
]

# Core: what the graph explorer and the AI teacher need, and nothing else.
# 83 MB installed, against 1.0 GB when every capability was mandatory — see
# docs/first-run.md for the measurements and why this split came first.
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "anthropic>=0.40",
    "pydantic>=2.7",
    "click>=8.1",
    "huggingface-hub>=0.28",
    # Direct since v8.1.0: config.py uses it to place config.json and data/ in a
    # per-user directory when running from an installed wheel. Already present
    # transitively, so this adds nothing to the install size.
    "platformdirs>=4.0",
    "pydantic-ai-slim[anthropic,openai,google]>=2.5.0",
    # Stays core although only the `sources` feature uses it: it is ~2 MB, and
    # `services/sources/` imports it from several call sites that would each
    # need a not-installed guard for no practical saving.
    "sqlite-vec>=0.1.6",
]

# Optional capabilities. Each one is heavy, each is imported lazily at a single
# guarded site (see `src/curious_astronaut/optional.py`), and each is useless to a reader who
# only wants the graph and the teacher. `uv sync --all-extras` for everything.
[project.optional-dependencies]
# Search over your own uploaded sources. The expensive one by a wide margin:
# torch alone is 418 MB, and on Linux the lockfile resolves 37 nvidia-* CUDA
# packages beneath it.
#
# >=5.6 for `get_embedding_dimension` (the 5.x rename of
# `get_sentence_embedding_dimension`, whose old name warns and will go).
# The old >=3.0 floor was nominal — uv.lock has pinned a 5.x for ages.
#
# torch is named here as well as pulled in by sentence-transformers, because
# `tool.uv.sources` (below) only applies to a project's DIRECT dependencies and
# routing the Windows build to the CUDA index is the whole point.
sources = ["sentence-transformers>=5.6", "torch>=2.9"]
# Mining figures, tables and algorithm boxes out of PDFs. Also the project's
# one AGPL dependency — optional here is what makes the licensing question in
# docs/licensing.md concrete rather than theoretical.
pdf = ["pymupdf>=1.24"]
# The offline Semantic Scholar citations corpus (`astronaut corpus …`), which is a
# power-user feature measured in hundreds of GB of data on disk.
corpus = ["duckdb>=1.5"]

[project.urls]
Homepage = "https://github.com/patrickjames0132/curious-astronaut"
Repository = "https://github.com/patrickjames0132/curious-astronaut"
Issues = "https://github.com/patrickjames0132/curious-astronaut/issues"
Changelog = "https://github.com/patrickjames0132/curious-astronaut/blob/main/docs/history.md"

[project.scripts]
astronaut = "curious_astronaut.cli:cli"

# Standard src-layout: the package is installed (editable, by uv) from src/, so
# `import curious_astronaut` works everywhere — tests, nox sessions, the console
# script — with no sys.path shims.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curious_astronaut"]

# The config template ships *inside* the package: an installed copy has no
# checkout to read it from, and `load_settings` creates a missing config.json
# from it. Tracked and always present, so a plain force-include is right here —
# if it ever goes missing the build should fail loudly.
[tool.hatch.build.targets.wheel.force-include]
"config.example.json" = "curious_astronaut/config.example.json"

# The built frontend is bundled by a hook instead, because it is a gitignored
# build artifact that may not exist yet — see hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# `frontend/dist` is gitignored, and hatchling honours VCS ignores, so it has
# to be declared an *artifact* to be packaged at all. The glob is tolerant of
# it not existing yet, unlike a force-include.
[tool.hatch.build]
artifacts = ["frontend/dist/**"]

# The sdist carries the frontend **source** (so the work-side import has real
# sources to build from — see the PyPI ticket) *and* the built `frontend/dist`.
# Shipping the build output in an sdist is unusual, but `uv build` builds the
# wheel **from the sdist**, so without it the wheel has no frontend and
# `pip install <sdist>` yields an app that serves only the "not built yet"
# hint. The alternative — requiring npm at install time — is far worse.
[tool.hatch.build.targets.sdist]
include = [
    "src/curious_astronaut",
    "frontend/src",
    "frontend/public",
    "frontend/dist",
    "frontend/index.html",
    "frontend/package.json",
    "frontend/package-lock.json",
    "frontend/tsconfig*.json",
    "frontend/vite.config.ts",
    "config.example.json",
    "hatch_build.py",
    "README.md",
    "LICENSE",
]

# --- torch: CUDA on Windows, stock PyPI everywhere else ---
#
# PyPI's torch for Windows is a CPU-only wheel, so the embedder was stuck on CPU
# no matter what device the code asked for. These wheels are the same torch built
# against the CUDA 13.0 runtime, which is what makes `sources.embedding.device`
# ("auto") able to find a GPU at all.
#
# `explicit = true` keeps this index opt-in: ONLY torch resolves from it, so no
# other package can be silently shadowed by a download.pytorch.org copy.
#
# The `sys_platform == 'win32'` marker is load-bearing — it keeps the multi-GB
# CUDA wheel (plus its bundled NVIDIA runtime libs) off macOS/Linux, where this
# repo is also worked on and where these wheels don't exist. Non-Windows keeps
# resolving torch from PyPI exactly as before.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[dependency-groups]
dev = [
    "nox>=2024.4",
    "mypy>=1.11",
    "pytest>=8.0",
    "pre-commit>=3.7",
    # The build backend, as a dev dependency so `hatch_build.py`'s frontend
    # bundling is importable — and therefore testable — outside a build.
    # test/test_packaging.py guards it; without that the hook could stop
    # shipping the frontend and nothing would notice until someone installed
    # the wheel.
    "hatchling>=1.25",
    # pydoclint is NOT a project dependency: it pins `docstring_parser_fork`,
    # which collides (same `docstring_parser` import package) with the mainline
    # `docstring-parser` that `anthropic` pulls in, and the mainline shadows the
    # fork so pydoclint won't import. The precommit hook runs it in an isolated,
    # pinned `uvx` env instead (see .pre-commit-config.yaml) — like ruff, a tool
    # not a dependency.
]
# --- quality tooling (all driven by `uv run nox`) ---

[tool.mypy]
files = ["src/curious_astronaut"]
mypy_path = "src"
# 3.12+: our floor is 3.11, but installed third-party stubs (numpy, pulled in by
# sentence-transformers) use 3.12 `type` syntax that mypy won't parse under an
# older target. We run on 3.14, so this is honest.
python_version = "3.12"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
# The 2026-07-04 baseline burndown removed every disabled error code (the four
# lenient-era codes are gone) and turned on untyped-body checking. Keep it that
# way: new code should type-check clean, no new disable_error_code entries.
check_untyped_defs = true

[tool.pytest.ini_options]
# Tests live in test/, mirroring src/curious_astronaut/. The app package comes from the
# editable install (src-layout); pythonpath is belt-and-braces for running pytest
# outside a synced uv env.
testpaths = ["test"]
# "." puts the repo root on the path too, so test_packaging.py can import the
# root-level `hatch_build.py` without a sys.path hack of its own.
pythonpath = ["src", "."]
# Test dirs have no __init__.py, so as source packages keep splitting into
# submodules (semantic_scholar/client.py, arxiv/client.py, ...), two
# test files can end up sharing a basename in different directories.
# importlib import mode resolves each by its full path instead of by
# basename, so that's a non-issue rather than a collision to avoid by hand.
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pyflakes (F), import sorting (I), pycodestyle (E) minus line-length (E501,
# left to the formatter's judgement), and pydocstyle (D): every module, class,
# and function must carry a docstring, Google-style. Completeness of the
# Args/Returns/Raises sections is pydoclint's job (see its pre-commit hook).
select = ["E", "F", "I", "D"]
# D205 (one-line summary + blank line) is deliberately off: the house style
# opens docstrings with a flowing multi-sentence paragraph, and flattening
# those to a single line would make the docs worse, not better.
ignore = ["E501", "D205"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Args/Returns/Raises COMPLETENESS (ruff's D rules only check presence/format).
# Types stay out of docstrings on purpose — the annotations own them — so the
# type-matching checks are off; what's enforced is that every section exists
# and matches the signature/body.
[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = true
# The house style documents PROPAGATED exceptions too (a client wrapper's
# "Raises: S2Error" is the caller's contract even though the raise lives in a
# callee) — pydoclint only accepts lexical `raise` statements, so its raises
# checks would outlaw exactly the docs we want. Raises stays human-judged.
skip-checking-raises = true
# ruff's D107 requires __init__ docstrings; don't let pydoclint fight it.
allow-init-docstring = true
show-filenames-in-every-violation-message = true
quiet = true

[tool.ruff.lint.per-file-ignores]
# Tests document themselves at the test-name + docstring level; don't demand
# module/function docstrings for every tiny fixture and case.
"test/**" = ["D"]
"noxfile.py" = ["D"]
