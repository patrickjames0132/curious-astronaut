# Tag-time checks and publishing for Curious Astronaut.
#
# The release ritual is deliberately manual and lives in CLAUDE.md ("Release
# mechanics"): bump `version` in pyproject.toml -> `uv lock` -> commit on the
# feature branch -> merge to main -> annotated tag vX.Y.Z -> push --follow-tags.
# Four hand-run steps, and nothing had ever checked that step 1 and step 5
# agree. A `v6.9.0` tag sitting on a tree that still says `6.8.0` is silent
# today; `version-matches-tag` makes it loud.
#
# Since v8.2.0 this file also BUILDS and PUBLISHES, which the packaging work in
# v8.1.0 unblocked. Three things about how it does that are load-bearing:
#
#   1. **The frontend is built before the wheel, always.** `hatch_build.py`
#      bundles `frontend/dist` into the wheel *when it exists* and skips
#      quietly when it does not — it has to, because `frontend/dist` is
#      gitignored and hatchling hard-fails on a missing force-include source,
#      which would break `uv sync` on a fresh clone. The cost of that tolerance
#      is that a wheel built without `npm run build` first is a VALID wheel
#      that serves the "Frontend not built yet" hint instead of the app. So the
#      build job runs npm first and then `verify-artifacts` asserts the bundle
#      actually made it in. Never reorder those steps.
#
#   2. **No API token exists.** Publishing uses PyPI's trusted publishing
#      (OIDC): the `id-token: write` permission lets the runner mint a
#      short-lived token PyPI verifies against a publisher config naming this
#      repo, this workflow filename, and the job's `environment`. Nothing
#      secret is stored in the repo, so there is nothing to leak or rotate.
#      Renaming this file or an environment below breaks publishing until the
#      publisher config on PyPI is updated to match.
#
#   3. **TestPyPI is not optional, and only a tag reaches PyPI.** A PyPI version
#      can never be replaced, only yanked, so `pypi` depends on `testpypi` —
#      there is no path to PyPI that skips the dry run, and because both jobs
#      consume the SAME artifact from one `build`, the rehearsal is byte-for-byte
#      what gets published. The manual trigger publishes to TestPyPI *only*; the
#      real upload happens on a `v*` tag push and nowhere else. That is enforced
#      twice over: by the `if:` on the `pypi` job, and by the `pypi`
#      environment's own deployment rule, which permits only `v*` tags.
#
#   4. **`uv build` rejects a cache directory inside the source tree.** Hence no
#      `UV_CACHE_DIR` here, unlike `ci.yml` — which pins the cache into the
#      workspace so one path works on Linux and Windows alike, and gets away
#      with it because `uv sync`/`uv run` don't care. `uv build` copies the tree
#      to make the sdist and fails with "The cache directory `.uv-cache` is
#      inside the build source directory". A release builds once, so a uv cache
#      bought nothing here anyway.
#
# The gate itself is not re-run here: the tag sits on a merge commit that the
# CI workflow already tested on push to main.
name: Release

on:
  push:
    tags: ['v*']
  # Rehearsal on demand: a manual run builds and publishes to **TestPyPI only**,
  # which is how the pipeline gets exercised without cutting a tag. It takes no
  # inputs on purpose — a "publish to PyPI too" option would only ever be
  # blocked by the `pypi` environment's tag-only rule, so offering it would be a
  # button that always fails. Dispatching from `main` builds whatever version
  # pyproject.toml currently says.
  workflow_dispatch:

# Read-only by default; the two publish jobs widen this for themselves.
permissions:
  contents: read

# Never cancel an in-flight publish — a half-finished upload is the one state
# worth avoiding here, so this deliberately does NOT cancel-in-progress.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # No UV_CACHE_DIR — see note 4 in the header. npm's cache is fine inside the
  # workspace: the sdist's `include` list is an allowlist, so it can't sweep it
  # in, and only `uv build` polices its own cache location.
  npm_config_cache: ${{ github.workspace }}/.npm-cache

jobs:
  version-matches-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match pyproject.toml version
        # Only meaningful on a tag push. On a manual run there is no tag to
        # compare against, so the next step just reports what will be built.
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu runners ship a python3 new enough for tomllib (3.11+), so
          # this needs no toolchain install and the job stays a few seconds.
          project_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml: ${project_version}"
          echo "tag:            ${GITHUB_REF_NAME} (-> ${tag_version})"
          if [ "${project_version}" != "${tag_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${project_version}." \
                 "Fix the version, re-lock, and move the tag."
            exit 1
          fi
          echo "Match."

      - name: Report the version being built
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "Manual run from ${GITHUB_REF_NAME}; building version ${project_version}."
          echo "::notice::Building curious-astronaut ${project_version} from ${GITHUB_REF_NAME}."

  build:
    needs: version-matches-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise reads .tool-versions, so the release build uses the SAME pinned
      # python / uv / nodejs the developer machines and CI do.
      - uses: jdx/mise-action@v4

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ${{ env.npm_config_cache }}
          key: npm-release-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-release-

      # `npm ci` rather than `npm install`: a release build should install
      # exactly what package-lock.json pins and fail if the lock is stale,
      # instead of quietly resolving something newer.
      - name: Install frontend deps (npm ci)
        run: npm ci --prefix frontend

      # MUST precede `uv build` — see note 1 in this file's header.
      - name: Build the frontend
        run: npm run build --prefix frontend

      # Builds the sdist, then the wheel FROM that sdist. That order is uv's
      # default and it is why the sdist has to carry `frontend/dist`
      # (`artifacts` + the sdist `include` list in pyproject.toml): a wheel
      # built from an sdist that excluded the bundle loses it too.
      - name: Build sdist and wheel
        run: uv build

      # Encodes the pre-publish audit that was done by hand for v8.1.0. Two
      # classes of problem, both permanent once uploaded: a wheel missing the
      # frontend (serves a hint instead of the app), and an artifact carrying
      # local state (`config.json` holds real API keys — it is gitignored, and
      # the sdist's allowlist `include` is what keeps it out).
      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          failures: list[str] = []

          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              print(f"::error::Expected one wheel and one sdist, found {wheels} and {sdists}.")
              sys.exit(1)
          wheel, sdist = wheels[0], sdists[0]

          wheel_names = zipfile.ZipFile(wheel).namelist()
          with tarfile.open(sdist) as archive:
              sdist_names = archive.getnames()

          # The bundled SPA, without which `astronaut serve` serves a hint.
          bundled = [name for name in wheel_names if "/_frontend/" in name]
          if not any(name.endswith("/_frontend/index.html") for name in bundled):
              failures.append(
                  f"{wheel.name} has no _frontend/index.html — was `npm run build` run before `uv build`?"
              )
          print(f"{wheel.name}: {len(bundled)} bundled frontend files")

          # Needed to write the first config.json on a fresh install.
          if not any(name.endswith("curious_astronaut/config.example.json") for name in wheel_names):
              failures.append(f"{wheel.name} is missing config.example.json")

          # The work side may want to rebuild the frontend from source.
          if not any("/frontend/src/" in name for name in sdist_names):
              failures.append(f"{sdist.name} carries no frontend/src")

          # Nothing local, ever. `config.json` is the dangerous one: it holds
          # real API keys, and an upload cannot be taken back.
          forbidden = ("config.json", ".env", ".pypirc")
          for label, names in ((wheel.name, wheel_names), (sdist.name, sdist_names)):
              for name in names:
                  tail = name.rsplit("/", 1)[-1]
                  if tail in forbidden or "/data/" in name or tail.endswith((".db", ".log")):
                      failures.append(f"{label} contains {name!r}, which must never ship")

          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          PY
          echo "Artifacts look right."

      - name: Show what will be published
        run: ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The dry run. `skip-existing` because re-running a release (or dispatching
  # `both` after a successful TestPyPI upload) must not fail on a version
  # TestPyPI already has.
  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # The real thing, and the irreversible one. Gated three ways: it needs the
  # TestPyPI run to have succeeded first, it runs on a `v*` tag push and nothing
  # else, and the `pypi` environment carries a required reviewer so a human
  # approves the upload. The environment also restricts itself to `v*` tags, so
  # the `if:` below and the deployment rule have to agree — loosen one without
  # the other and publishing either silently widens or starts failing.
  pypi:
    needs: testpypi
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
