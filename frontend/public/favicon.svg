  </g>

  <!-- glass rim -->
  <path d="M16 32C16 22.5 23 17 32 17s16 5.5 16 15c0 9-7 15-16 15s-16-6-16-15Z" fill="none" stroke="#6FB6CE" stroke-width="1.5"/>

