  <rect x="4.5" y="25.5" width="6.5" height="13" rx="2.6" fill="#F7F5F0"/>
  <rect x="53" y="25.5" width="6.5" height="13" rx="2.6" fill="#F7F5F0"/>

  <!-- visor glass -->
  <path d="M16 32C16 22.5 23 17 32 17s16 5.5 16 15c0 9-7 15-16 15s-16-6-16-15Z" fill="#12314A"/>

